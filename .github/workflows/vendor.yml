name: vendor
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: vendor
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: run
        run: |
          out=$(python -m src.vendor.apply)
          echo "$out"
          echo "msg=$out" >> "$GITHUB_OUTPUT"
      - name: Commit the database if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vendor.db
          if git diff --cached --quiet; then
            echo "database unchanged"
          else
            git commit -m "vendor: ${{ steps.run.outputs.msg }}"
            git push
          fi
